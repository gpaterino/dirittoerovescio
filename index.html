            // Fisher-Yates shuffle applied to all difficulty levels
            for (let i = optionsToRender.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsToRender[i], optionsToRender[j]] = [optionsToRender[j], optionsToRender[i]];
            }

            // Determine badge for current path
            let pathBadge = '';
            if (selectedPath === 'giallo') pathBadge = '<span class="bg-yellow-500 text-slate-950 font-bold px-3 py-1 rounded-md text-sm">🟨 Percorso Giallo</span>';
            else if (selectedPath === 'arancione') pathBadge = '<span class="bg-orange-500 text-slate-950 font-bold px-3 py-1 rounded-md text-sm">🟧 Percorso Arancione</span>';
            else if (selectedPath === 'rosso') pathBadge = '<span class="bg-red-600 text-white font-bold px-3 py-1 rounded-md text-sm">🟥 Percorso Rosso</span>';

            let optionsHtml = '';
            optionsToRender.forEach((optObj) => {
                optionsHtml += `
                    <button onclick="checkAnswer(${optObj.originalIndex})" class="btn w-full text-left bg-slate-700 hover:bg-slate-600 text-slate-100 p-5 rounded-xl text-lg md:text-xl shadow-md border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400 min-h-[64px]">
                        ${optObj.text}
                    </button>
                `;
            });

            appContainer.innerHTML = `
                <div class="fade-in w-full max-w-3xl">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-6">
                        <div>
                            ${pathBadge}
                            <h2 class="text-xl md:text-2xl font-bold text-amber-400 mt-2">Prova ${currentQuestionIndex + 1} di ${currentQuestions.length}</h2>
                        </div>
                        <span class="bg-slate-800 text-slate-300 px-4 py-2 rounded-lg font-mono border border-slate-700 text-sm md:text-base">Progresso: ${Math.round((currentQuestionIndex / currentQuestions.length) * 100)}%</span>
                    </div>
                    
                    <div class="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                        <p class="text-xl md:text-2xl text-white mb-8 font-medium leading-snug">${q.text}</p>
                        <div class="flex flex-col gap-4">
                            ${optionsHtml}
                        </div>
                    </div>

                    <!-- Feedback Area (Hidden by default) -->
                    <div id="feedback-area" class="hidden mt-6 p-6 rounded-xl shadow-lg"></div>
                </div>
            `;
        }

        // Must be global for onclick
        window.checkAnswer = function(selectedIndex) {
            const q = currentQuestions[currentQuestionIndex];
            const feedbackArea = document.getElementById('feedback-area');
            const optionsButtons = document.querySelectorAll('#app-container .bg-slate-700');

            // Disable all buttons to prevent multiple clicks during feedback
            optionsButtons.forEach(btn => btn.disabled = true);
            optionsButtons.forEach(btn => btn.classList.remove('hover:bg-slate-600', 'cursor-pointer'));

            if (selectedIndex === q.correctAnswer) {
                // Correct!
                optionsButtons[selectedIndex].classList.add('bg-green-600', 'border-green-500', 'text-white');
                
                feedbackArea.className = 'mt-6 p-6 rounded-xl shadow-lg bg-green-900 border border-green-600 fade-in';
                feedbackArea.innerHTML = `
                    <div class="flex items-start gap-4">
                        <span class="text-4xl">✓</span>
                        <div>
                            <h3 class="text-2xl font-bold text-green-100 mb-2">Esatto!</h3>
                            <p class="text-green-50 text-lg">${q.explanation}</p>
                            <button onclick="nextQuestion()" class="btn mt-6 bg-green-700 hover:bg-green-600 text-white px-8 py-3 rounded-lg font-bold text-xl w-full sm:w-auto shadow">
                                Prossima Prova ➔
                            </button>
                        </div>
                    </div>
                `;
            } else {
                // Wrong!
                optionsButtons[selectedIndex].classList.add('bg-red-800', 'border-red-600', 'text-white');
                
                if (!currentQuestionMistaked) {
                    mistakes.push({
                        text: q.text,
                        explanation: q.explanation
                    });
                    currentQuestionMistaked = true;
                }

                feedbackArea.className = 'mt-6 p-6 rounded-xl shadow-lg bg-red-900 border border-red-700 fade-in';
                feedbackArea.innerHTML = `
                    <div class="flex items-start gap-4">
                        <span class="text-4xl">✗</span>
                        <div class="w-full">
                            <h3 class="text-2xl font-bold text-red-100 mb-2">Risposta Errata</h3>
                            <p class="text-red-50 text-lg mb-6">${q.explanation}</p>
                            <div class="flex flex-col sm:flex-row gap-4">
                                <button onclick="resetQuestion()" class="btn bg-red-700 hover:bg-red-600 text-white px-6 py-3 rounded-lg font-bold text-lg flex-1 shadow">
                                    Riprova
                                </button>
                                <button onclick="navigate('scopri_detail', ${q.cardRef})" class="btn bg-slate-700 hover:bg-slate-600 text-sky-300 px-6 py-3 rounded-lg font-bold text-lg flex-1 border border-slate-500 shadow flex items-center justify-center gap-2">
                                    <span>📖</span> Leggi la Scheda
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        window.nextQuestion = function() {
            currentQuestionIndex++;
            renderSfida();
        };

        window.resetQuestion = function() {
            renderSfida(); // Just re-render the same question to try again
        };

        function renderRiepilogo() {
            let contentHtml = '';
            let pathName = selectedPath === 'giallo' ? 'Giallo (Facile)' : (selectedPath === 'arancione' ? 'Arancione (Intermedio)' : 'Rosso (Difficile)');
            
            // SVG Ironico per la schermata di festeggiamento/giubilo
            const jubileeSvg = `
                <div class="my-6 flex flex-col items-center justify-center fade-in">
                    <div class="relative bg-slate-800 border-2 border-amber-400/50 p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center">
                        <div class="text-6xl mb-2 animate-bounce">🏛️✨</div>
                        <svg class="w-32 h-32 mx-auto mb-2 text-amber-400 filter drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <!-- Classical Statue Head with Cool Sunglasses (Irony) -->
                            <path d="M12 2C7.58 2 4 5.58 4 10c0 2.5 1.14 4.74 2.93 6.22L6 22l4-2 2 1 2-1 4 2-.93-5.78C18.86 14.74 20 12.5 20 10c0-4.42-3.58-8-8-8z" stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Laurel wreath -->
                            <path d="M7 8c-1.5-1-2.5 0-2.5 0M17 8c1.5-1 2.5 0 2.5 0M8 5c-1-1.5 0-2.5 0-2.5M16 5c1-1.5 0-2.5 0-2.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
                            <!-- Sunglasses -->
                            <rect x="6.5" y="8.5" width="4.5" height="3" rx="1" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
                            <rect x="13" y="8.5" width="4.5" height="3" rx="1" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
                            <line x1="11" y1="10" x2="13" y2="10" stroke="#fbbf24" stroke-width="1.5"/>
                            <!-- Smirk smile -->
                            <path d="M10 15c1.5 1 3.5 1 4.5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <div class="bg-amber-400 text-slate-950 text-xs font-black uppercase tracking-widest py-1 px-3 rounded-full inline-block mb-1 shadow">
                            Approvato dai Costituenti 😎
                        </div>
                        <p class="text-xs text-slate-400 italic">"Articolo 130: Chi supera la Sfida merita un 10 d'ufficio!"</p>
                    </div>
                </div>
            `;

            if (mistakes.length === 0) {
                contentHtml = `
                    <div class="text-center p-4">
                        <div class="text-6xl mb-4">🏆</div>
                        <h2 class="text-4xl font-bold text-green-400 mb-2">Percorso Netto!</h2>
                        <p class="text-lg text-amber-300 mb-2 font-semibold">Percorso completato: ${pathName}</p>
                        ${jubileeSvg}
                        <p class="text-xl text-slate-200">Bravissimo! Hai dimostrato di padroneggiare perfettamente i Principi Fondamentali della Costituzione Italiana senza commettere alcun errore.</p>
                    </div>
                `;
            } else {
                contentHtml = `
                    <div class="text-center mb-6">
                        <div class="text-5xl mb-2">🎉</div>
                        <h2 class="text-3xl font-bold text-amber-400 mb-2">Escape Room Completata!</h2>
                        <p class="text-md text-amber-200 font-semibold mb-2">Percorso completato: ${pathName}</p>
                        ${jubileeSvg}
                        <p class="text-lg text-slate-300">Hai concluso le 20 prove. Ecco il riepilogo degli ostacoli incontrati per poter ripassare.</p>
                    </div>
                    
                    <div class="space-y-4">
                        <h3 class="text-xl font-bold text-white mb-4 border-b border-slate-600 pb-2">I tuoi errori (${mistakes.length}):</h3>
                `;
                
                mistakes.forEach((m, idx) => {
                    contentHtml += `
                        <div class="bg-slate-800 p-5 rounded-lg border border-red-900/50 shadow-md">
                            <p class="font-semibold text-slate-200 mb-2"><span class="text-red-400">Domanda:</span> ${m.text}</p>
                            <p class="text-slate-400"><span class="text-green-400">Cosa ricordare:</span> ${m.explanation}</p>
                        </div>
                    `;
                });
                contentHtml += `</div>`;
            }

            appContainer.innerHTML = `
                <div class="fade-in w-full max-w-3xl bg-slate-900/50 p-6 md:p-10 rounded-2xl shadow-2xl border border-slate-700">
                    ${contentHtml}
                    <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="navigate('menu')" class="btn bg-sky-600 hover:bg-sky-500 text-white px-8 py-4 rounded-xl font-bold text-xl shadow-lg">
                            Torna al Menu Principale
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize App
        navigate('menu');

    </script>
</body>
</html>
